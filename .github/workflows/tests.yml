name: tests

on:
  push:
    branches: [master]
  pull_request:
    # labeled/unlabeled too, so a "no changelog" label added after the
    # pull request opened reaches the changelog check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      # The providers, from their master and without their dependencies
      # (which pin another core): pyright reads tests/docs and the site
      # documents them.
      - run: >-
          uv pip install --no-deps
          "aiollm-openai @ git+https://github.com/aiollm-org/aiollm_openai@master"
          "aiollm-anthropic @ git+https://github.com/aiollm-org/aiollm_anthropic@master"
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest --mypy -m mypy tests/typing
      - run: >-
          uv run --no-sync rumdl check
          README.md CHANGELOG.md CONTRIBUTING.md docs
      - run: uv run --no-sync mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  test-matrix:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every CPython the package supports (requires-python >= 3.13);
        # 3.13, the oldest, is also what .python-version pins locally.
        python: ["3.13", "3.14", "3.15"]
    env:
      # For every uv command of the job: with only `uv sync --python`,
      # `uv run` would take .python-version's 3.13 and rebuild the
      # environment without the test group.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: >-
          uv run pytest --cov --cov-branch --cov-report=xml
          --html=report.html --self-contained-html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            report.html

  tests:
    # One stable name for the branch ruleset, whatever the matrix holds.
    name: tests
    if: always()
    needs: [test-matrix]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Install the wheel into a clean environment and import it
        run: |
          uv venv --python 3.13 .wheel-env
          uv pip install --python .wheel-env dist/*.whl
          .wheel-env/bin/python - <<'EOF'
          from importlib.metadata import version

          import sys

          import aiollm

          assert aiollm.__version__ == version("aiollm-core"), (
              aiollm.__version__,
              version("aiollm-core"),
          )
          # The core loads no transport and no provider on import.
          loaded = [
              name
              for name in sys.modules
              if name == "aiohttp" or name.startswith("aiollm_")
          ]
          assert loaded == [], loaded
          print("aiollm-core", aiollm.__version__, "imports from its wheel")
          EOF

  downstream:
    # The providers on this core: each provider's own suite, with the
    # core of this branch in place of its pin, then the core's examples
    # of the site and the extension API check, with both providers
    # installed. Required unless the pull request is a breaking change
    # (a "**Breaking:**" fragment), which the providers follow in their
    # own pull requests (CONTRIBUTING.md).
    name: downstream (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic]
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
      - uses: actions/checkout@v7
        with:
          repository: aiollm-org/aiollm_${{ matrix.provider }}
          path: provider
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The provider's tests on this core
        working-directory: provider
        run: |
          uv sync --all-groups --no-group codegen --locked
          # The pinned core goes, whatever its distribution name.
          uv pip uninstall aiollm aiollm-core
          uv pip install -e "../core[testing]"
          uv run --no-sync pytest -q
      - name: The core's examples and extension API with the providers
        working-directory: core
        run: |
          uv sync --all-groups --locked
          uv pip install --no-deps \
            "aiollm-openai @ git+https://github.com/aiollm-org/aiollm_openai@master" \
            "aiollm-anthropic @ git+https://github.com/aiollm-org/aiollm_anthropic@master"
          uv run --no-sync pytest -q tests/docs tests/downstream

  changelog:
    # A pull request adds a fragment to CHANGES/ (or, for a release,
    # changes CHANGELOG.md itself); the "no changelog" label skips the
    # check for a change no user sees.
    name: changelog
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: >-
          uv run --locked --only-group dev
          towncrier check --compare-with origin/${{ github.base_ref }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Known vulnerabilities in every locked dependency, dev tools too.
      # An exception is an --ignore <ID> with its reason in a comment
      # (rule, reason, scope, owner, review condition: manifest §18).
      - run: uv audit --locked --preview-features audit-command
