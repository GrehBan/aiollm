name: docs

on:
  push:
    branches: [master]
  # Weekly too: the reference pages of the providers are built from
  # their master, which moves without a push here.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --group docs --locked
      # The providers, from their master and without their dependencies
      # (which pin another core): the site documents them.
      - run: >-
          uv pip install --no-deps
          "aiollm-openai @ git+https://github.com/aiollm-org/aiollm_openai@master"
          "aiollm-anthropic @ git+https://github.com/aiollm-org/aiollm_anthropic@master"
      - run: uv run --no-sync mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
